name: Release OpenMDL

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            target: 'aarch64-unknown-linux-gnu'
            args: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenMDL ${{ github.ref_name }}'
          releaseBody: |
            ## OpenMDL - Caisse & Foyer MDL

            Application moderne et intuitive pour la gestion de caisse, stocks, terminaux TPE SumUp et comptabilité de foyer lycéen.

            ### Téléchargements disponibles ci-dessous :
            - **Windows PC (x64)** : `.exe` (Installateur NSIS) ou `.msi`
            - **Windows ARM64 (Surface Pro X, Copilot+ PC Snapdragon)** : `.exe` (Installateur NSIS)
            - **Linux PC (x86_64)** : `.deb` et `.AppImage`
            - **Linux ARM64 (aarch64 / Raspberry Pi 4-5)** : `.deb` et `.AppImage`
            - **macOS Apple Silicon (ARM64 M1 / M2 / M3 / M4)** : `.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
